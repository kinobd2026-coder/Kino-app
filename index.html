<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kino Online Shop</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <!-- Main Header -->
    <header class="bg-indigo-900 text-white sticky top-0 z-50 shadow-md">
      <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="text-2xl font-extrabold tracking-wider text-amber-400">KINO</h1>
        <div class="relative">
          <i data-lucide="shopping-cart" class="w-6 h-6"></i>
          <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
      <!-- Banner -->
      <div class="bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-6 text-white shadow-lg">
        <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">স্পেশাল অফার</span>
        <h2 class="text-2xl font-bold mt-2">Kino ই-কমার্স অ্যাপে স্বাগতম!</h2>
        <p class="text-sm opacity-90 mt-1">সবচেয়ে সেরা দামে কেনাকাটা করুন সহজে।</p>
      </div>

      <!-- Category Filter -->
      <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button class="bg-indigo-900 text-amber-400 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">সব প্রোডাক্ট</button>
        <button class="bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">ইলেকট্রনিক্স</button>
        <button class="bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">ফ্যাশন</button>
        <button class="bg-white text-slate-600 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">গ্যাজেট</button>
      </div>

      <!-- Product List Placeholder -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Sample Product Card -->
        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex flex-col justify-between">
          <div>
            <div class="bg-slate-100 h-28 rounded-lg mb-2 flex items-center justify-center text-slate-400">
              <i data-lucide="package" class="w-10 h-10"></i>
            </div>
            <h3 class="font-bold text-sm text-slate-800 line-clamp-1">স্মার্ট ওয়াচ X8</h3>
            <p class="text-xs text-slate-500 mt-0.5">হাই-কোয়ালিটি ডিসপ্লে</p>
          </div>
          <div class="mt-3 flex items-center justify-between">
            <span class="text-amber-600 font-bold text-sm">৳ ১,২০০</span>
            <button class="bg-indigo-900 text-white p-1.5 rounded-lg">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 flex flex-col justify-between">
          <div>
            <div class="bg-slate-100 h-28 rounded-lg mb-2 flex items-center justify-center text-slate-400">
              <i data-lucide="package" class="w-10 h-10"></i>
            </div>
            <h3 class="font-bold text-sm text-slate-800 line-clamp-1">ওয়্যারলেস হেডফোন</h3>
            <p class="text-xs text-slate-500 mt-0.5">বেস্ট বেস সাউন্ড</p>
          </div>
          <div class="mt-3 flex items-center justify-between">
            <span class="text-amber-600 font-bold text-sm">৳ ৮৫০</span>
            <button class="bg-indigo-900 text-white p-1.5 rounded-lg">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Initialize Lucide Icons
      lucide.createIcons();
    </script>
  </body>
</html>
